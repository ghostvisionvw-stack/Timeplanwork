<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — TimePlan.work</title>
<style>
:root {
  --bg: #0b0e18; --bg2: #131728; --bg3: #1c2136;
  --border: #252d4a; --text: #e8edf8; --muted: #6b7799;
  --accent: #3d7fff; --green: #00c875; --red: #ff5f57; --orange: #ff6b35;
  --font: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

/* NAV */
nav {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.nav-logo { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; text-decoration: none; color: var(--text); }
.nav-logo span { color: var(--accent); }
.nav-badge {
  background: rgba(255,107,53,0.15); color: var(--orange);
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 8px;
}
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-user { font-size: 13px; color: var(--muted); }
.btn-sm {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); border-radius: 8px; padding: 6px 14px;
  font-size: 13px; cursor: pointer; font-family: var(--font);
  transition: border-color 0.2s; text-decoration: none; display: inline-block;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* LAYOUT */
.layout { display: flex; min-height: calc(100vh - 60px); }
.sidebar {
  width: 220px; background: var(--bg2); border-right: 1px solid var(--border);
  padding: 24px 16px; flex-shrink: 0;
  position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto;
}
.sidebar-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px; cursor: pointer;
  font-size: 14px; color: var(--muted); transition: background 0.15s, color 0.15s;
  margin-bottom: 2px;
}
.sidebar-item:hover { background: var(--bg3); color: var(--text); }
.sidebar-item.active { background: rgba(61,127,255,0.12); color: var(--accent); font-weight: 600; }
.main { flex: 1; padding: 28px 28px; overflow-x: hidden; }

/* SECTIONS */
.section { display: none; }
.section.active { display: block; }
.section-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 20px; }

/* STATS GRID */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
}
.stat-card .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-card .val { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
.stat-card .val.green { color: var(--green); }
.stat-card .val.accent { color: var(--accent); }
.stat-card .val.orange { color: var(--orange); }

/* TABLE */
.table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
.table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.table-header h3 { font-size: 15px; font-weight: 700; }
.search-input {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 13px; padding: 8px 12px;
  font-family: var(--font); outline: none; width: 220px;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
td { padding: 12px 20px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge.pro { background: rgba(61,127,255,0.15); color: var(--accent); }
.badge.free { background: rgba(107,119,153,0.15); color: var(--muted); }
.badge.active { background: rgba(0,200,117,0.15); color: var(--green); }
.badge.inactive { background: rgba(255,95,87,0.15); color: var(--red); }

.action-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px; padding: 4px 10px;
  font-size: 11px; cursor: pointer; font-family: var(--font);
  transition: all 0.15s; margin-right: 4px;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.danger:hover { border-color: var(--red); color: var(--red); }
.action-btn.success:hover { border-color: var(--green); color: var(--green); }

/* PAGINATION */
.pagination { display: flex; align-items: center; gap: 8px; padding: 16px 20px; }
.page-btn {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 6px 12px;
  font-size: 13px; cursor: pointer; font-family: var(--font);
}
.page-btn:hover { border-color: var(--accent); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-info { font-size: 13px; color: var(--muted); }

/* LOGS */
.log-item {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-size: 13px; display: flex; gap: 16px; align-items: flex-start;
}
.log-item:last-child { border-bottom: none; }
.log-action {
  font-weight: 700; min-width: 140px; font-size: 12px;
  font-family: monospace; color: var(--accent);
}
.log-meta { color: var(--muted); font-size: 12px; }

/* EMPTY */
.empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }

/* LOADING */
.loading { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:8px">
    <a class="nav-logo" href="/">Time<span>Plan</span>.work</a>
    <span class="nav-badge">Admin</span>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <a href="/dashboard" class="btn-sm">Mon compte</a>
    <button class="btn-sm" onclick="logout()" style="border-color:var(--red);color:var(--red)">Déconnexion</button>
  </div>
</nav>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-label">Navigation</div>
    <div class="sidebar-item active" onclick="showSection('dashboard', this)">📊 Dashboard</div>
    <div class="sidebar-item" onclick="showSection('users', this)">👥 Utilisateurs</div>
    <div class="sidebar-item" onclick="showSection('logs', this)">📋 Audit Logs</div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- DASHBOARD -->
    <div class="section active" id="section-dashboard">
      <div class="section-title">Dashboard</div>
      <div class="stats-grid" id="stats-grid">
        <div class="loading">Chargement...</div>
      </div>
    </div>

    <!-- USERS -->
    <div class="section" id="section-users">
      <div class="section-title">Utilisateurs</div>
      <div class="table-wrap">
        <div class="table-header">
          <h3>Liste des comptes</h3>
          <input class="search-input" id="search-input" placeholder="🔍 Rechercher email ou nom..." oninput="searchUsers()" />
        </div>
        <div id="users-table-wrap">
          <div class="loading">Chargement...</div>
        </div>
        <div class="pagination" id="pagination" style="display:none">
          <button class="page-btn" id="btn-prev" onclick="changePage(-1)">← Précédent</button>
          <span class="page-info" id="page-info"></span>
          <button class="page-btn" id="btn-next" onclick="changePage(1)">Suivant →</button>
        </div>
      </div>
    </div>

    <!-- LOGS -->
    <div class="section" id="section-logs">
      <div class="section-title">Audit Logs</div>
      <div class="table-wrap">
        <div class="table-header"><h3>Journal d'activité</h3></div>
        <div id="logs-wrap"><div class="loading">Chargement...</div></div>
      </div>
    </div>

  </div>
</div>

<script>
const token = localStorage.getItem('access_token');
const user = JSON.parse(localStorage.getItem('user') || 'null');

if (!token || !user || !user.is_admin) {
  window.location.href = '/login';
}

document.getElementById('nav-user').textContent = user.email;

let currentPage = 1;
let searchTimer = null;

// ── API HELPER ──
async function api(url) {
  const res = await fetch(url, {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
  return res.json();
}

// ── NAVIGATION ──
function showSection(name, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  el.classList.add('active');

  if (name === 'dashboard') loadDashboard();
  if (name === 'users') { currentPage = 1; loadUsers(); }
  if (name === 'logs') loadLogs();
}

// ── DASHBOARD ──
async function loadDashboard() {
  const data = await api('/api/admin/dashboard');
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="lbl">Utilisateurs total</div><div class="val accent">${data.users.total}</div></div>
    <div class="stat-card"><div class="lbl">Abonnés Pro</div><div class="val green">${data.users.pro}</div></div>
    <div class="stat-card"><div class="lbl">Comptes gratuits</div><div class="val">${data.users.free}</div></div>
    <div class="stat-card"><div class="lbl">Nouveaux aujourd'hui</div><div class="val accent">${data.users.new_today}</div></div>
    <div class="stat-card"><div class="lbl">MRR estimé</div><div class="val orange">${data.mrr_estimate}€</div></div>
    <div class="stat-card"><div class="lbl">Journées enregistrées</div><div class="val">${data.work_days.total}</div></div>
  `;
}

// ── USERS ──
async function loadUsers(search = '') {
  const wrap = document.getElementById('users-table-wrap');
  wrap.innerHTML = '<div class="loading">Chargement...</div>';

  const q = search ? `&search=${encodeURIComponent(search)}` : '';
  const data = await api(`/api/admin/users?page=${currentPage}&per_page=20${q}`);

  if (!data.users || data.users.length === 0) {
    wrap.innerHTML = '<div class="empty">Aucun utilisateur trouvé.</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Nom</th>
          <th>Plan</th>
          <th>Statut</th>
          <th>Inscription</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${data.users.map(u => `
          <tr>
            <td>${u.email}</td>
            <td>${u.full_name || '—'}</td>
            <td><span class="badge ${u.is_pro ? 'pro' : 'free'}">${u.is_pro ? 'Pro' : 'Gratuit'}</span></td>
            <td><span class="badge ${u.is_active ? 'active' : 'inactive'}">${u.is_active ? 'Actif' : 'Inactif'}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString('fr-BE')}</td>
            <td>
              <button class="action-btn success" onclick="grantPro(${u.id})">Pro +30j</button>
              <button class="action-btn ${u.is_active ? 'danger' : ''}" onclick="toggleUser(${u.id})">${u.is_active ? 'Désactiver' : 'Activer'}</button>
              <button class="action-btn" onclick="unlockUser(${u.id})">Déverrouiller</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  const totalPages = Math.ceil(data.total / data.per_page);
  document.getElementById('pagination').style.display = 'flex';
  document.getElementById('page-info').textContent = `Page ${currentPage} / ${totalPages} (${data.total} utilisateurs)`;
  document.getElementById('btn-prev').disabled = currentPage <= 1;
  document.getElementById('btn-next').disabled = currentPage >= totalPages;
}

function changePage(dir) {
  currentPage += dir;
  loadUsers(document.getElementById('search-input').value);
}

function searchUsers() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentPage = 1;
    loadUsers(document.getElementById('search-input').value);
  }, 400);
}

// ── ACTIONS ──
async function grantPro(userId) {
  if (!confirm('Accorder 30 jours Pro à cet utilisateur ?')) return;
  const res = await fetch(`/api/admin/users/${userId}/grant-pro`, {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + token }
  });
  const d = await res.json();
  alert(d.message || 'Fait !');
  loadUsers(document.getElementById('search-input').value);
}

async function toggleUser(userId) {
  if (!confirm('Modifier le statut de ce compte ?')) return;
  const res = await fetch(`/api/admin/users/${userId}/activate`, {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + token }
  });
  const d = await res.json();
  alert(d.message || 'Fait !');
  loadUsers(document.getElementById('search-input').value);
}

async function unlockUser(userId) {
  const res = await fetch(`/api/admin/users/${userId}/unlock`, {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + token }
  });
  const d = await res.json();
  alert(d.message || 'Déverrouillé !');
}

// ── LOGS ──
async function loadLogs() {
  const data = await api('/api/admin/audit-logs?per_page=50');
  const wrap = document.getElementById('logs-wrap');

  if (!data.logs || data.logs.length === 0) {
    wrap.innerHTML = '<div class="empty">Aucun log disponible.</div>';
    return;
  }

  wrap.innerHTML = data.logs.map(l => `
    <div class="log-item">
      <span class="log-action">${l.action}</span>
      <span>User #${l.user_id || '?'}</span>
      <span class="log-meta">IP: ${l.ip_address || '—'}</span>
      <span class="log-meta">${new Date(l.at).toLocaleString('fr-BE')}</span>
    </div>
  `).join('');
}

// ── LOGOUT ──
async function logout() {
  const refresh = localStorage.getItem('refresh_token');
  try {
    await fetch('/api/auth/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refresh })
    });
  } catch(e) {}
  localStorage.clear();
  window.location.href = '/login';
}

// Init
loadDashboard();
</script>
</body>
</html>
